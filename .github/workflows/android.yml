name: Build Android TV AAB

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Structure
      run: |
        # Biztosítjuk, hogy a mappák létezzenek
        mkdir -p app/src/main/java/hu/mflix.hu
        mkdir -p app/src/main/res/mipmap
        
        # Ha a gyökérben maradtak volna fájlok, áthelyezzük őket, ha már az app-ban vannak, átmásoljuk/hagyjuk
        [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/ || echo "Manifest already moved"
        [ -f "MainActivity.java" ] && mv MainActivity.java app/src/main/java/hu/mflix.hu/ || echo "Activity already moved"
        [ -f "build.gradle" ] && mv build.gradle app/ || echo "build.gradle already moved"
        
        # Gyökér szintű beállítás létrehozása
        echo "allprojects { repositories { google() mavenCentral() } }" > build.gradle
        echo "Project structure ready and verified!"

    - name: Build with Gradle
      run: |
        gradle wrapper
        ./gradlew bundleRelease

    - name: Upload AAB Package
      uses: actions/upload-artifact@v4
      with:
        name: mflix-tv-release
        path: app/build/outputs/bundle/release/app-release.aab
