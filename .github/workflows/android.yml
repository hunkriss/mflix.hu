name: Build Android TV AAB

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Structure
      run: |
        mkdir -p app/src/main/java/hu/mflix.hu
        mkdir -p app/src/main/res/mipmap
        
        mv AndroidManifest.xml app/src/main/
        mv MainActivity.java app/src/main/java/hu/mflix.hu/
        mv build.gradle app/
        
        echo "allprojects { repositories { google() mavenCentral() } }" > build.gradle
        echo "Project structure ready!"

    - name: Build with Gradle
      run: |
        gradle wrapper
        ./gradlew bundleRelease

    - name: Upload AAB Package
      uses: actions/upload-artifact@v4
      with:
        name: mflix-tv-release
        path: app/build/outputs/bundle/release/app-release.aab
